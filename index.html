<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guess the Logo Quiz</title>
<style>
:root{--ink:#211b43;--purple:#6c42f5;--pink:#ff4fa3;--yellow:#ffd84d;--green:#28c98b}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:linear-gradient(135deg,#fff3a9,#ffd5e8 45%,#c9f8ff);color:var(--ink);min-height:100vh}header{padding:20px 14px;text-align:center;background:linear-gradient(100deg,#7048ff,#ff4fa3);color:white;border-bottom:5px solid var(--ink)}h1{margin:0;font-size:clamp(27px,7vw,42px)}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}button{border:0;border-radius:14px;padding:12px 15px;font-weight:800;font-size:15px;background:var(--yellow);color:var(--ink);cursor:pointer}.primary{background:var(--purple);color:white}.pink{background:var(--pink);color:white}button:disabled{opacity:.5}main{max-width:800px;margin:auto;padding:0 12px 28px}.panel{background:white;border:3px solid var(--ink);border-radius:23px;padding:17px;margin:10px 0}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.badge{background:#e8e0ff;padding:6px 10px;border-radius:99px;font-weight:900;text-align:center}.question{text-align:center;font-size:clamp(20px,5vw,27px);font-weight:950;margin:15px 0}.logoBox{height:190px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px dashed #d5cffa;border-radius:18px;margin:12px 0;padding:15px}.logoBox img{max-width:100%;max-height:160px;object-fit:contain}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.answer{background:white;border:3px solid #d8d0ff;overflow-wrap:anywhere}.correct{border-color:#18b77a!important;background:#e0fff1!important}.wrong{border-color:#ff4f72!important;background:#fff0f3!important}.feedback{text-align:center;font-weight:900;min-height:28px;margin:12px 0}.hidden{display:none!important}input{width:100%;padding:13px;border:2px solid #d5cffa;border-radius:12px;font:inherit;margin:8px 0}.footer{text-align:center;padding:16px;font-size:12px}@media(min-width:600px){.panel{padding:23px}.logoBox{height:230px}}
</style></head><body>
<header><h1>🏆 Guess the Logo!</h1><p>Know the brand? Prove it and beat your score.</p></header>
<nav><button id="choiceMode" class="primary">🎯 4 Options</button><button id="hardMode">🔥 Hard Mode</button><button id="langBtn">🌐 English / اردو</button></nav>
<main><section class="panel"><div class="row"><span class="badge" id="category">Brands</span><span class="badge" id="progress">Question 1</span><span class="badge" id="score">Score: 0</span></div>
<div class="question" id="prompt">Which brand owns this logo?</div><div class="logoBox"><img id="logo" alt="Quiz logo"></div>
<div id="choices" class="answers"></div><div id="typed" class="hidden"><label id="typeLabel" for="brandGuess">Type the brand name</label><input id="brandGuess" autocomplete="off" placeholder="Your answer"><button class="primary" id="submitGuess" style="width:100%">Check answer</button></div>
<div class="feedback" id="feedback" aria-live="polite"></div><div class="row"><button class="primary" id="next" disabled>Next ➜</button><button id="restart">↻ Restart</button></div>
<p>Demo logo cards use simple symbol placeholders. Replace them with logo images you have permission to use.</p></section></main><div class="footer">Mobile-first • English + Urdu labels • Free GitHub Pages demo</div>
<script>
const demo=[
{name:"Nike",category:"Sports",mark:"✓",color:"#111111"},{name:"Apple",category:"Technology",mark:"●",color:"#222222"},{name:"Adidas",category:"Sports",mark:"▰",color:"#111111"},{name:"McDonald's",category:"Food",mark:"M",color:"#e31b23"},{name:"YouTube",category:"Technology",mark:"▶",color:"#ff0033"},{name:"Pepsi",category:"Food",mark:"◉",color:"#005cb4"},{name:"Puma",category:"Sports",mark:"P",color:"#111111"},{name:"Microsoft",category:"Technology",mark:"▦",color:"#1768d1"},{name:"Coca-Cola",category:"Food",mark:"C",color:"#e41e26"},{name:"Instagram",category:"Technology",mark:"◎",color:"#c13584"},{name:"Amazon",category:"Shopping",mark:"a",color:"#232f3e"},{name:"Netflix",category:"Entertainment",mark:"N",color:"#e50914"}];
let logos=demo.map(x=>({...x,image:makeLogo(x)})),idx=0,score=0,answered=false,mode="choice",lang="en";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function makeLogo(x){if(x.image)return x.image;let n=esc(x.name),m=esc(x.mark||x.name),c=x.color||"#333";let svg='<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260"><rect width="100%" height="100%" rx="28" fill="white"/><text x="240" y="115" text-anchor="middle" font-family="Arial" font-weight="900" font-size="94" fill="'+c+'">'+m+'</text><text x="240" y="200" text-anchor="middle" font-family="Arial" font-weight="800" font-size="35" fill="#222">'+n+'</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
async function loadPack(){try{let r=await fetch("./logos.json?v="+Date.now());if(r.ok){let d=await r.json();if(Array.isArray(d)&&d.length)logos=d.map(x=>({...x,image:x.image||makeLogo(x)}))}}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){if(idx>=logos.length)idx=0;let q=logos[idx];answered=false;document.getElementById("category").textContent=q.category||"Brands";document.getElementById("progress").textContent=(lang==="en"?"Question ":"سوال ")+(idx+1)+" / "+logos.length;document.getElementById("score").textContent=(lang==="en"?"Score: ":"اسکور: ")+score;document.getElementById("prompt").textContent=lang==="en"?"Which brand owns this logo?":"یہ کس برانڈ کا لوگو ہے؟";document.getElementById("logo").src=q.image||makeLogo(q);document.getElementById("feedback").textContent="";document.getElementById("next").disabled=true;document.getElementById("next").textContent=lang==="en"?"Next ➜":"اگلا ➜";
let cs=document.getElementById("choices"),ty=document.getElementById("typed");if(mode==="choice"){cs.classList.remove("hidden");ty.classList.add("hidden");let opts=shuffle([q,...shuffle(logos.filter((x,i)=>i!==idx)).slice(0,3)]);cs.innerHTML=opts.map(x=>'<button class="answer" data-name="'+esc(x.name)+'">'+esc(x.name)+'</button>').join("");cs.querySelectorAll("button").forEach(b=>b.onclick=()=>choose(b.dataset.name,b))}else{cs.classList.add("hidden");ty.classList.remove("hidden");document.getElementById("brandGuess").value="";document.getElementById("brandGuess").disabled=false;document.getElementById("brandGuess").placeholder=lang==="en"?"Type brand name...":"برانڈ کا نام لکھیں";document.getElementById("typeLabel").textContent=lang==="en"?"Type the brand name":"برانڈ کا نام لکھیں";document.getElementById("submitGuess").disabled=false}}
function finish(ok,q){if(ok){score+=mode==="hard"?20:10;document.getElementById("feedback").textContent=(lang==="en"?"🎉 Correct! +":"🎉 درست! +")+(mode==="hard"?20:10)+" points"}else document.getElementById("feedback").textContent=(lang==="en"?"Correct answer: ":"درست جواب: ")+q.name;document.getElementById("score").textContent=(lang==="en"?"Score: ":"اسکور: ")+score;document.getElementById("next").disabled=false}
function choose(name,b){if(answered)return;answered=true;let q=logos[idx],ok=name.trim().toLowerCase()===q.name.trim().toLowerCase();document.querySelectorAll("#choices button").forEach(x=>{x.disabled=true;if(x.dataset.name.toLowerCase()===q.name.toLowerCase())x.classList.add("correct");if(x===b&&!ok)x.classList.add("wrong")});finish(ok,q)}
document.getElementById("submitGuess").onclick=()=>{if(answered)return;let inp=document.getElementById("brandGuess"),q=logos[idx];answered=true;inp.disabled=true;document.getElementById("submitGuess").disabled=true;finish(inp.value.trim().toLowerCase()===q.name.trim().toLowerCase(),q)};
document.getElementById("brandGuess").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("submitGuess").click()});
document.getElementById("next").onclick=()=>{idx++;if(idx>=logos.length)idx=0;render()};document.getElementById("restart").onclick=()=>{idx=0;score=0;render()};
document.getElementById("choiceMode").onclick=()=>{mode="choice";document.getElementById("choiceMode").className="primary";document.getElementById("hardMode").className="";render()};document.getElementById("hardMode").onclick=()=>{mode="hard";document.getElementById("hardMode").className="pink";document.getElementById("choiceMode").className="";render()};
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"ur":"en";render()};loadPack().then(render);
</script></body></html>
